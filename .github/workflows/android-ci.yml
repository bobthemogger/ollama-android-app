name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties','**/*.gradle*','**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable if present
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew; fi

      - name: Ensure Gradle 8.4 (use wrapper if available)
        run: |
          if [ -x ./gradlew ]; then
            echo "Using Gradle wrapper"
          else
            echo "Gradle wrapper not found, installing Gradle 8.4 to PATH"
            wget https://services.gradle.org/distributions/gradle-8.4-bin.zip -O gradle-8.4-bin.zip
            unzip -q gradle-8.4-bin.zip -d $HOME
            echo "$HOME/gradle-8.4/bin" >> $GITHUB_PATH
          fi

      - name: Verify Gradle & Java
        run: |
          if [ -x ./gradlew ]; then ./gradlew --version; else gradle --version; fi
          java -version

      - name: Ensure Android SDK packages (if sdkmanager is present)
        run: |
          # If sdkmanager is available, install needed packages and accept licenses.
          if command -v sdkmanager >/dev/null 2>&1; then
            echo "sdkmanager found; installing platform-tools, build-tools and platform (android-34)"
            yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
            yes | sdkmanager --licenses
          else
            echo "sdkmanager not found; relying on runner preinstalled SDK or you must install SDK in the workflow."
          fi

      - name: Build debug APK
        env:
          # If your repo expects ANDROID_HOME/ANDROID_SDK_ROOT, set it here or in secrets
          # ANDROID_SDK_ROOT: ${{ runner.os == 'Windows' && 'C:\\Android\\sdk' || '/usr/local/android-sdk' }}
        run: |
          set -e
          if [ -x ./gradlew ]; then
            ./gradlew clean assembleDebug --stacktrace --info
          else
            gradle clean assembleDebug --stacktrace --info
          fi

      - name: Upload debug APK
        if: success() && always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
