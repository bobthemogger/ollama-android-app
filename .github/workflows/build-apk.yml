name: Build OllamaApp APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Gradle 7.6.3
        run: |
          cd /tmp
          curl -sL https://services.gradle.org/distributions/gradle-7.6.3-bin.zip -o gradle-7.6.3-bin.zip
          unzip -o gradle-7.6.3-bin.zip -d /opt/gradle
          echo "Gradle files:" && ls /opt/gradle/gradle-7.6.3/bin/

      - name: Create Gradle Wrapper
        run: |
          mkdir -p /opt/gradle7
          ls /opt/gradle/gradle-7.6.3/bin/gradle
          cp -r /opt/gradle/gradle-7.6.3 /opt/gradle7/gradle-7.6.3
          chmod +x /opt/gradle7/gradle-7.6.3/bin/gradle
          ln -sf /opt/gradle7/gradle-7.6.3/bin/gradle /usr/local/bin/gradle7
          /opt/gradle7/gradle-7.6.3/bin/gradle wrapper --gradle-version=7.6.3 --no-daemon
          chmod +x /public/ollama-app/gradlew

      - name: Build with Gradle
        run: |
          cd /public/ollama-app
          export PATH=/opt/gradle7/gradle-7.6.3/bin:$PATH
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ollama-app-apk
          path: app/build/outputs/apk/debug/*.apk